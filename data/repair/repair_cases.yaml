- case: s02_c1
  base_init: {heater_bedroom.power: "off", window_living.position: closed}  # explicit state of every effect source
  dynamics:
    temp_living: {rate: 0.1, max: 30, min: 15}
  hazard:
    - name: evening heating overshoots
      start: "17:50"
      minutes: 120
      init: {temp_living: 22, heater_living.power: "off", window_living.position: closed}
      ever: [{ref: heater_living.power, value: "on"}, {ref: window_living.position, value: open}]
  intent:
    - name: R1 starts heating at 18:00 on a cool evening
      start: "17:55"
      minutes: 10
      init: {temp_living: 20, heater_living.power: "off"}
      at_end: [{ref: heater_living.power, value: "on"}]
    - name: R2 ventilates an overheated room (heater off)
      start: "14:00"
      minutes: 10
      init: {temp_living: 25, heater_living.power: "off", window_living.position: closed}
      events: [{at: "14:02", set: {temp_living: 27}}]
      at_end: [{ref: window_living.position, value: open}, {ref: vent_living.power, value: "on"}]

- case: s13_c1
  hazard:
    - name: noon feeding while away
      start: "11:55"
      minutes: 10
      init: {home_mode: away, feeder.dispensing: "off", alarm.siren: "off", motion_kitchen: false}
      ever: [{ref: alarm.siren, value: "on"}]
  intent:
    - name: R1 feeds the cat at noon while the owner is away
      start: "11:55"
      minutes: 10
      init: {home_mode: away, feeder.dispensing: "off"}
      at_end: [{ref: feeder.dispensing, value: "on"}]
    - name: R2 sounds the alarm on kitchen motion while away (no feeding)
      start: "15:00"
      minutes: 5
      init: {home_mode: away, feeder.dispensing: "off", alarm.siren: "off", motion_kitchen: false}
      events: [{at: "15:01", set: {motion_kitchen: true}}]
      at_end: [{ref: alarm.siren, value: "on"}]

- case: s15_c2
  base_init: {ac_living.mode: "off", window_bedroom.position: closed, window_living.position: closed}  # explicit state of every effect source
  hazard:
    - name: afternoon watering on a dry day
      start: "13:55"
      minutes: 10
      init: {sprinkler.watering: "off", rain_sensor: false, skylight.position: open}
      ever: [{ref: skylight.position, value: closed}]
  intent:
    - name: R3 waters the lawn at 14:00
      start: "13:55"
      minutes: 10
      init: {sprinkler.watering: "off"}
      at_end: [{ref: sprinkler.watering, value: "on"}]
    - name: R4 closes the skylight when real rain starts during watering (added after the rubric pilot)
      start: "13:55"
      minutes: 20
      init: {sprinkler.watering: "off", rain_sensor: false, skylight.position: open}
      events: [{at: "14:05", set: {rain_sensor: true}}]
      at_end: [{ref: skylight.position, value: closed}]
    - name: R4 closes the skylight when it really rains
      start: "16:00"
      minutes: 5
      init: {sprinkler.watering: "off", rain_sensor: false, skylight.position: open}
      events: [{at: "16:01", set: {rain_sensor: true}}]
      at_end: [{ref: skylight.position, value: closed}]

- case: s19_c1
  dynamics:
    noise_nursery: {rate: 5, max: 65}
  hazard:
    - name: white noise starts at 19:30
      start: "19:25"
      minutes: 20
      init: {noise_nursery: 40, white_noise.playing: "off", nursery_lamp.power: "off", soundbar.power: "off", tv.power: "off"}
      ever: [{ref: nursery_lamp.power, value: "on"}]
  intent:
    - name: R2 starts the white noise at 19:30
      start: "19:25"
      minutes: 10
      init: {noise_nursery: 40, white_noise.playing: "off", soundbar.power: "off", tv.power: "off"}
      at_end: [{ref: white_noise.playing, value: "on"}]
    - name: R1 reacts to real crying while the white noise plays (added after the rubric pilot)
      # New requirement: the original rules fail it too (the white noise already
      # triggered R1, so real crying gives no new trigger). `witness` is an edit
      # that satisfies it, so the requirement is known to be achievable.
      new_requirement: true
      witness: {target_rule: R1, operation: change_trigger, trigger: {type: env, ref: noise_nursery, op: ">", value: "70"}, graph_path: [R1], rationale: witness}
      start: "19:25"
      minutes: 40
      init: {noise_nursery: 40, white_noise.playing: "off", nursery_lamp.power: "off", soundbar.power: "off", tv.power: "off"}
      events: [{at: "19:45", set: {nursery_lamp.power: "off"}}, {at: "20:00", set: {noise_nursery: 80}}]
      at_end: [{ref: nursery_lamp.power, value: "on"}]
    - name: R1 reacts to crying (quiet room)
      start: "03:00"
      minutes: 5
      init: {noise_nursery: 40, white_noise.playing: "off", nursery_lamp.power: "off", soundbar.power: "off", tv.power: "off"}
      events: [{at: "03:01", set: {noise_nursery: 75}}]
      at_end: [{ref: nursery_lamp.power, value: "on"}]
