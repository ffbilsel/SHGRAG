id: s11_thermostat_schedule
name: Shared flat
split: dev
family: thermostat_schedule
description: Two flatmates created thermostat and AC routines independently.
rooms: [living_room, home]
devices:
  - id: thermostat
    type: thermostat
    room: living_room
    description: Central heating thermostat
    states: {setpoint: [], mode: [heat, eco, off]}
  - id: ac_living
    type: air_conditioner
    room: living_room
    description: Split air conditioner
    states: {mode: [cool, heat, off]}
environment:
  - id: home_mode
    room: home
    kind: categorical
    values: [home, away, night]
    description: Household mode
  - id: temp_living
    room: living_room
    kind: numeric
    description: Living room temperature (C)
effects:
  - source: ac_living.mode
    when: cool
    target: temp_living
    effect: decrease
    kind: environmental
    description: Cooling lowers the room temperature
  - source: thermostat.mode
    when: heat
    target: temp_living
    effect: increase
    kind: environmental
    description: Radiator heating raises the room temperature
rules:
  - id: R1
    text: At 18:00 set the thermostat to 23 C.
    trigger: {type: time, at: "18:00"}
    actions: [{ref: thermostat.setpoint, value: 23}, {ref: thermostat.mode, value: heat}]
  - id: R2
    text: When someone arrives home between 17:00 and 19:00, set the thermostat to 19 C (eco).
    trigger: {type: env, ref: home_mode, value: home}
    conditions: [{type: time_range, start: "17:00", end: "19:00"}]
    actions: [{ref: thermostat.setpoint, value: 19}, {ref: thermostat.mode, value: eco}]
  - id: R3
    text: When the living room is warmer than 24 C, switch the air conditioner to cooling.
    trigger: {type: env, ref: temp_living, op: ">", value: 24}
    actions: [{ref: ac_living.mode, value: cool}]
  - id: R4
    text: When the living room is colder than 20 C, set the thermostat to heat.
    trigger: {type: env, ref: temp_living, op: "<", value: 20}
    actions: [{ref: thermostat.mode, value: heat}]
  - id: R5
    text: At 08:00 set the thermostat to eco mode.
    trigger: {type: time, at: "08:00"}
    actions: [{ref: thermostat.mode, value: eco}]
cases:
  - id: s11_c1
    rules: [R1, R2]
    label: conflict
    type: logical
    justification: Around 18:00 both rules write different setpoints and modes to the same thermostat.
    situation: "Someone arrives home between 17:00 and 19:00, around 18:00."
    undesired_outcome: "R1 sets 23 C and R2 sets 19 C on the same thermostat; the final setpoint depends on timing."
    key_nodes: [thermostat]
  - id: s11_c2
    rules: [R3, R4]
    label: conflict
    type: semantic
    justification: AC cooling drives the temperature below 20 C, which makes R4 start heating - the systems fight each other.
    situation: "The living room is warmer than 24 C so R3 starts cooling, and the AC drives it below 20 C."
    undesired_outcome: "R4 switches the thermostat to heat while the AC is still cooling; heating and cooling fight each other."
    key_nodes: [ac_living, temp_living]
  - id: s11_c3
    rules: [R1, R5]
    label: clean
    justification: Heat at 18:00 and eco at 08:00 is a normal daily schedule.
    situation: "Near miss: Different setpoints on the same thermostat, but at different times of day."
    hard: true
home_conflicts:
  - rules: [R2, R4]
    type: logical
    justification: Arriving home between 17:00 and 19:00 makes R2 set eco mode while a room below 20 C makes R4 set heat on the same thermostat.
    situation: "Someone arrives home between 17:00 and 19:00 while the living room is colder than 20 C."
    undesired_outcome: "R2 sets eco and R4 sets heat on the same thermostat; the final mode depends on execution order."
  - rules: [R4, R5]
    type: logical
    justification: R5 sets eco mode at 08:00; whenever the room is below 20 C, R4 switches the thermostat back to heat.
    situation: "At 08:00 (or later in the day) while the living room is colder than 20 C."
    undesired_outcome: "R4 overrides R5's eco schedule; the thermostat flips between eco and heat."
home_clean_notes:
  "R1+R3": "R1 heats to a 23 C setpoint, below R3's 24 C cooling threshold, so the heating does not trigger cooling."
