id: s03_robot_vacuum
name: Suburban house
description: Robot vacuum cleaning the ground floor while presence routines control
  lock and alarm.
rooms:
- living_room
- entrance
- bedroom
- home
devices:
- id: vacuum
  type: robot_vacuum
  room: living_room
  description: Robot vacuum with docking station
  states:
    mode:
    - cleaning
    - docked
- id: lock_entrance
  type: smart_lock
  room: entrance
  description: Entrance door smart lock
  states:
    lock:
    - locked
    - unlocked
- id: alarm
  type: alarm_siren
  room: entrance
  description: Indoor siren
  states:
    siren:
    - 'on'
    - 'off'
- id: light_entrance
  type: light
  room: entrance
  description: Entrance ceiling light
  states:
    power:
    - 'on'
    - 'off'
environment:
- id: motion_living
  room: living_room
  kind: boolean
  description: Living room PIR motion sensor
  values: []
- id: motion_bedroom
  room: bedroom
  kind: boolean
  description: Bedroom PIR motion sensor
  values: []
- id: home_mode
  room: home
  kind: categorical
  description: Household mode
  values:
  - home
  - away
  - night
effects:
- source: vacuum.mode
  when: cleaning
  target: motion_living
  effect: set
  value: true
  kind: environmental
  description: The moving vacuum is detected by the living room motion sensor
rules:
- id: R1
  text: At 10:00 on weekdays start the robot vacuum.
  trigger:
    type: time
    at: '10:00'
    op: ==
  conditions: []
  actions:
  - ref: vacuum.mode
    value: cleaning
- id: R2
  text: When motion is detected in the living room, unlock the entrance door (someone
    is home).
  trigger:
    type: env
    ref: motion_living
    op: ==
    value: true
  conditions:
  - type: state
    ref: vacuum.mode
    op: '!='
    value: cleaning
  actions:
  - ref: lock_entrance.lock
    value: unlocked
- id: R3
  text: When motion is detected in the living room while the home is in away mode,
    sound the alarm.
  trigger:
    type: env
    ref: motion_living
    op: ==
    value: true
  conditions:
  - type: env
    ref: home_mode
    op: ==
    value: away
  actions:
  - ref: alarm.siren
    value: 'on'
- id: R4
  text: When motion is detected in the bedroom, turn on the entrance light.
  trigger:
    type: env
    ref: motion_bedroom
    op: ==
    value: true
  conditions: []
  actions:
  - ref: light_entrance.power
    value: 'on'
cases:
- id: s03_c1
  rules:
  - R1
  - R2
  label: conflict
  type: semantic
  justification: The vacuum triggers the living room motion sensor, so R2 unlocks
    the door while nobody is home.
  situation: The robot vacuum starts at 10:00 on a weekday while the occupants are
    out.
  undesired_outcome: The vacuum's movement triggers the living-room motion sensor
    and R2 unlocks the entrance door of an empty home.
  key_nodes:
  - vacuum
  - motion_living
  hard: false
- id: s03_c2
  rules:
  - R1
  - R3
  label: conflict
  type: semantic
  justification: When the vacuum runs during away mode its motion sets off the alarm
    (false alarm).
  situation: The vacuum runs at 10:00 while the home is in away mode.
  undesired_outcome: The vacuum triggers the living-room motion sensor and R3 sounds
    the alarm (false alarm).
  key_nodes:
  - vacuum
  - motion_living
  hard: false
- id: s03_c3
  rules:
  - R1
  - R4
  label: clean
  justification: The vacuum cleans the living room; the bedroom motion sensor is not
    affected.
  situation: 'Near miss: The vacuum does create motion, but in a different room than
    R4''s sensor.'
  key_nodes: []
  hard: true
split: dev
family: robot_vacuum
home_conflicts: []
home_clean_notes: {}
