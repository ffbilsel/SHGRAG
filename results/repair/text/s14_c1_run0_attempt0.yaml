id: s14_elderly_care
name: Bungalow
description: A CPAP machine, night lights and a fall-detection routine in a senior's
  apartment.
rooms:
- bedroom
- bathroom
- corridor
- home
devices:
- id: plug_bedside
  type: smart_plug
  room: bedroom
  description: Bedside smart plug
  states:
    power:
    - 'on'
    - 'off'
- id: cpap
  type: medical_device
  room: bedroom
  description: CPAP breathing machine
  states:
    power:
    - 'on'
    - 'off'
- id: nightlight_corridor
  type: light
  room: corridor
  description: Corridor night light
  states:
    power:
    - 'on'
    - 'off'
- id: lock_entrance
  type: smart_lock
  room: corridor
  description: Entrance door lock
  states:
    lock:
    - locked
    - unlocked
- id: plug_reading_lamp
  type: smart_plug
  room: bedroom
  description: Plug for the reading lamp
  states:
    power:
    - 'on'
    - 'off'
environment:
- id: home_mode
  room: home
  kind: categorical
  description: Household mode
  values:
  - home
  - away
  - night
- id: fall_detected
  room: bathroom
  kind: boolean
  description: Fall detection radar in the bathroom
  values: []
- id: motion_corridor
  room: corridor
  kind: boolean
  description: Corridor motion sensor
  values: []
effects:
- source: plug_bedside.power
  when: 'off'
  target: cpap.power
  effect: set
  value: 'off'
  kind: physical
  description: The CPAP machine is plugged into the bedside smart plug
rules:
- id: R1
  text: At 23:30 turn off the bedside plug (phone charger) to save energy.
  trigger:
    type: time
    at: '23:30'
    op: ==
  conditions:
  - type: state
    ref: cpap.power
    op: '!='
    value: 'on'
  actions:
  - ref: plug_bedside.power
    value: 'off'
- id: R2
  text: When the home switches to night mode, make sure the CPAP machine is on.
  trigger:
    type: env
    ref: home_mode
    op: ==
    value: night
  conditions: []
  actions:
  - ref: cpap.power
    value: 'on'
- id: R3
  text: When a fall is detected, unlock the entrance door for paramedics.
  trigger:
    type: env
    ref: fall_detected
    op: ==
    value: true
  conditions: []
  actions:
  - ref: lock_entrance.lock
    value: unlocked
- id: R4
  text: When the home switches to night mode, lock the entrance door.
  trigger:
    type: env
    ref: home_mode
    op: ==
    value: night
  conditions: []
  actions:
  - ref: lock_entrance.lock
    value: locked
- id: R5
  text: At 23:30 turn off the reading lamp plug.
  trigger:
    type: time
    at: '23:30'
    op: ==
  conditions: []
  actions:
  - ref: plug_reading_lamp.power
    value: 'off'
cases:
- id: s14_c1
  rules:
  - R1
  - R2
  label: conflict
  type: physical
  justification: The 'phone charger' plug actually powers the CPAP machine; switching
    it off at 23:30 stops a medical device.
  situation: Night mode is active at 23:30.
  undesired_outcome: R1 turns off the bedside plug that actually powers the CPAP machine;
    a medical device stops during sleep.
  key_nodes:
  - plug_bedside
  - cpap
  hard: false
- id: s14_c2
  rules:
  - R3
  - R4
  label: conflict
  type: logical
  justification: A fall during night mode needs the door unlocked while R4 keeps locking
    it.
  situation: A fall is detected while the home is (or switches) into night mode.
  undesired_outcome: R3 unlocks the entrance for paramedics and R4 locks it; paramedics
    may be locked out.
  key_nodes:
  - lock_entrance
  hard: false
- id: s14_c3
  rules:
  - R5
  - R2
  label: clean
  justification: The reading lamp plug does not power the CPAP machine.
  situation: 'Near miss: A plug goes off at 23:30, but it powers the reading lamp,
    not the CPAP.'
  key_nodes: []
  hard: true
split: dev
family: elderly_care
home_conflicts: []
home_clean_notes: {}
