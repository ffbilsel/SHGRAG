id: s04_kitchen_safety
name: Downtown apartment
description: Oven, range hood, smoke detector and a door lock that reacts to smoke.
rooms:
- kitchen
- entrance
- home
devices:
- id: oven
  type: oven
  room: kitchen
  description: Connected electric oven
  states:
    power:
    - 'on'
    - 'off'
- id: hood
  type: range_hood
  room: kitchen
  description: Kitchen extractor hood
  states:
    power:
    - 'on'
    - 'off'
- id: lock_door
  type: smart_lock
  room: entrance
  description: Apartment door lock
  states:
    lock:
    - locked
    - unlocked
- id: hvac
  type: hvac
  room: home
  description: Central air handler
  states:
    power:
    - 'on'
    - 'off'
environment:
- id: smoke_kitchen
  room: kitchen
  kind: boolean
  description: Kitchen smoke detector
  values: []
- id: home_mode
  room: home
  kind: categorical
  description: Household mode
  values:
  - home
  - away
  - night
effects:
- source: hood.power
  when: 'on'
  target: smoke_kitchen
  effect: set
  value: false
  kind: environmental
  description: The hood clears cooking fumes from the kitchen
rules:
- id: R1
  text: When smoke is detected in the kitchen, unlock the apartment door for evacuation
    and turn off the air handler.
  trigger:
    type: env
    ref: smoke_kitchen
    op: ==
    value: true
  conditions: []
  actions:
  - ref: lock_door.lock
    value: unlocked
  - ref: hvac.power
    value: 'off'
- id: R2
  text: When the home switches to away mode, lock the apartment door.
  trigger:
    type: env
    ref: home_mode
    op: ==
    value: away
  conditions:
  - type: state
    ref: smoke_kitchen
    op: ==
    value: false
  actions:
  - ref: lock_door.lock
    value: locked
- id: R3
  text: When the oven is turned on, turn on the range hood.
  trigger:
    type: state
    ref: oven.power
    op: ==
    value: 'on'
  conditions: []
  actions:
  - ref: hood.power
    value: 'on'
- id: R4
  text: At 08:00 turn on the air handler.
  trigger:
    type: time
    at: 08:00
    op: ==
  conditions: []
  actions:
  - ref: hvac.power
    value: 'on'
cases:
- id: s04_c1
  rules:
  - R1
  - R2
  label: conflict
  type: logical
  justification: If smoke appears while the home is switched to away, R1 unlocks for
    evacuation while R2 locks the door.
  situation: Smoke is detected in the kitchen while (or just after) the home switches
    to away mode.
  undesired_outcome: R1 unlocks the door for evacuation and R2 locks it; the evacuation
    route may end up locked.
  key_nodes:
  - lock_door
  hard: false
- id: s04_c2
  rules:
  - R1
  - R4
  label: conflict
  type: logical
  justification: During a smoke event at 08:00 R4 re-enables the air handler that
    R1 shut down, spreading smoke.
  situation: A smoke event is in progress at 08:00.
  undesired_outcome: R4 turns the air handler back on after R1 shut it down, spreading
    smoke through the flat.
  key_nodes:
  - hvac
  hard: false
- id: s04_c3
  rules:
  - R3
  - R2
  label: clean
  justification: Range hood control is unrelated to locking the door when leaving.
  key_nodes: []
  hard: false
split: dev
family: kitchen_safety
home_conflicts:
- rules:
  - R1
  - R3
  type: semantic
  justification: The range hood that R3 starts whenever the oven is on clears the
    kitchen smoke reading, so R1's evacuation response can be delayed or never fire
    during a real fire.
  situation: Smoke develops while the oven (and therefore the hood) is on.
  undesired_outcome: The smoke sensor reads clear; the door is not unlocked for evacuation
    and the air handler keeps running.
  added_by: adjudication
home_clean_notes: {}
